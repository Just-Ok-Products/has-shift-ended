name: Deploy frontend

on:
  push:
    branches: [master]
    paths:
      - 'ShiftManager.UI/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShiftManager.UI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ShiftManager.UI/package-lock.json

      - run: npm ci

      - run: npm run build -- --configuration production

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ShiftManager.UI/dist/has-shift-ended/browser
