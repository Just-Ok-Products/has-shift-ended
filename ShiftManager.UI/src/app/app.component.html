<button class="theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.current === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro'">
  <svg *ngIf="theme.current === 'dark'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
  <svg *ngIf="theme.current === 'light'" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
    <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-7.54-7.54c-.44-.06-.9-.1-1.36-.1z"/>
  </svg>
</button>
