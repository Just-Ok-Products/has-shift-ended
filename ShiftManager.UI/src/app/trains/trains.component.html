<details>
  <summary>Cambia stazioni di partenza/arrivo</summary>
  <div class="stations-row">
    <app-station-search label="Partenza" [query]="'Udine'" (stationSelected)="onDepartureSelected($event)"></app-station-search>
    <app-station-search label="Arrivo" (stationSelected)="onArrivalSelected($event)"></app-station-search>
  </div>
  <label class="margin-field">
    Minuti per raggiungere la stazione
    <input type="number" min="0" [(ngModel)]="trainSuggestionService.marginMinutes">
  </label>
  <button type="button" [disabled]="!arrivalLocationId" (click)="search()">Cerca</button>
</details>

<button type="button" (click)="toggleReachableNow()">
  {{ showReachableNow ? 'Nascondi treno raggiungibile ora' : 'Mostra treno raggiungibile ora' }}
</button>

<p class="loading" *ngIf="isLoading">Cercando…</p>
<div class="train-list" *ngIf="dataFromTrenitalia">
  <app-train-card *ngFor="let item of dataFromTrenitalia.solutions"
    [solution]="item"
    [highlighted]="isReachableNow(item)"
  ></app-train-card>
</div>
